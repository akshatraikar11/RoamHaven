apiVersion: apps/v1
kind: Deployment
metadata:
  name: roamhaven-app
  labels:
    app: roamhaven
spec:
  replicas: 2
  selector:
    matchLabels:
      app: roamhaven
  template:
    metadata:
      labels:
        app: roamhaven
    spec:
      containers:
        - name: roamhaven
          image: roamhaven:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: roamhaven-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
