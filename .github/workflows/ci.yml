name: CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Job 1: Automated Unit & Integration Testing
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Jest)
        run: npm run test:unit

      - name: Run integration tests
        env:
          ATLASDB_URL: mongodb://127.0.0.1:27017/roamhaven_test
          REDIS_URL: redis://127.0.0.1:6379
          SECRET: ci-test-secret
        run: npm run test:integration

  # Job 2: Secret & Credential Scanning (DevSecOps)
  gitleaks:
    name: Gitleaks Secret Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # Job 3: Dependency Security Scanning (Snyk & npm audit)
  security-audit:
    name: Snyk & Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk Open Source audit
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # Job 4: Container Build & Trivy CVE Security Scan
  docker-trivy:
    name: Docker Build & Trivy Container Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t roamhaven:ci .

      - name: Run Trivy vulnerability scanner on container image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'roamhaven:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
