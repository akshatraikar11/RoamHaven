services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      ATLASDB_URL: mongodb://mongo:27017/roamhaven
      REDIS_URL: redis://redis:6379
      SECRET: ${SECRET:-change-me-in-production}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongo_data:
